Builds:
  - versionName: 0.1.0
    versionCode: 1
    commit: bd7a0f33b48ebeb96c2d1285f4354d41e997e5df
    subdir: app
    gradle:
      - yes
    prebuild:
      - sed -i -e '/foojay/d' ../settings.gradle.kts
      - sed -i "s/ -XX:+ParallelRefParsingEnabled//" ../gradle.properties
    gradleprops:
      - pixelplayer.enableAbiSplits=false
      - pixelplayer.disableReleaseSigning=true

